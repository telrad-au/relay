services:
  relay:
    image: ${TELRAD_RELAY_IMAGE:?Set TELRAD_RELAY_IMAGE to an immutable version and digest}
    restart: unless-stopped
    # Prevent writes outside the persistent relay-data volume.
    read_only: true
    # Relay does not require any additional Linux capabilities.
    cap_drop:
      - ALL
    # Prevent the process from gaining additional privileges.
    security_opt:
      - no-new-privileges:true
    # Allow active DICOM and HL7 exchanges to finish during shutdown.
    stop_grace_period: 2m
    environment:
      # Hostname or IP address of the clinic report receiver.
      TELRAD_RELAY_REPORT_HOST: ${TELRAD_RELAY_REPORT_HOST:?Set the clinic report receiver hostname or address}
      # TCP port of the clinic report receiver.
      TELRAD_RELAY_REPORT_PORT: ${TELRAD_RELAY_REPORT_PORT:-2576}
      # Optional enrolment endpoint override for development.
      TELRAD_RELAY_ENROLMENT_URL: ${TELRAD_RELAY_ENROLMENT_URL:-}
      # Single-use pairing token, read on the first run or by
      # `docker compose run --rm relay pair`. Export it only in the shell
      # that pairs; never save it in the env file.
      TELRAD_RELAY_PAIRING_TOKEN: ${TELRAD_RELAY_PAIRING_TOKEN:-}
    ports:
      - ${TELRAD_RELAY_BIND_ADDRESS:?Set the clinic-facing host address}:11112:11112/tcp
      - ${TELRAD_RELAY_BIND_ADDRESS:?Set the clinic-facing host address}:2575:2575/tcp
    volumes:
      - relay-data:/var/lib/telrad-relay

volumes:
  relay-data:
    name: telrad-relay-data
