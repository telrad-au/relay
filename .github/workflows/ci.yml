name: CI

on:
    pull_request:
    push:
        branches:
            - dev
            - main

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    GO_VERSION: 1.27.0
    GOVULNCHECK_VERSION: v1.7.0

jobs:
    test:
        name: Test and build
        runs-on: ubuntu-24.04
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - name: Audit publication, licences, and distributed dependencies
              run: |
                  scripts/check-publication.sh
                  scripts/check-licenses.sh

            - name: Test
              run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

            # Reported for review only; there is no coverage threshold.
            - name: Report coverage
              run: |
                  {
                      echo '### Relay coverage'
                      echo '```text'
                      go tool cover -func=coverage.out
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Check formatting
              run: test -z "$(gofmt -l .)"

            - name: Vet
              run: go vet ./...

            - name: Scan for known vulnerabilities
              run: |
                  go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
                  govulncheck ./...

            - name: Build native release artifacts
              run: |
                  set -euo pipefail
                  sh -n packaging/install.sh
                  scripts/build-release.sh 0.0.0-ci.1
                  (
                      cd dist/0.0.0-ci.1
                      sha256sum --check --strict SHA256SUMS
                      sha256sum --check --strict telrad-relay-linux-amd64.sha256
                  )
                  [[ "$(dist/0.0.0-ci.1/telrad-relay-linux-amd64 version)" == "0.0.0-ci.1" ]]

            - name: Build container
              run: |
                  set -euo pipefail
                  production_enrolment_url='https://ingest.app.telrad.com.au/v1/relay/enrolments'
                  docker build --build-arg VERSION=0.0.0-ci.1 --tag telrad-relay:ci .
                  [[ "$(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges telrad-relay:ci version)" == "0.0.0-ci.1" ]]
                  [[ "$(docker image inspect --format '{{.Config.User}}' telrad-relay:ci)" == "10001:10001" ]]
                  [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' telrad-relay:ci)" == "Apache-2.0" ]]
                  [[ "$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' telrad-relay:ci)" == '["CMD","telrad-relay","--config","/var/lib/telrad-relay/relay.json","ready"]' ]]
                  container="$(docker create telrad-relay:ci)"
                  trap 'docker rm --force "$container" >/dev/null' EXIT
                  mkdir -p "$RUNNER_TEMP/container-licences"
                  docker cp "$container:/usr/share/licenses/telrad-relay/." "$RUNNER_TEMP/container-licences/"
                  cmp LICENSE "$RUNNER_TEMP/container-licences/LICENSE"
                  cmp NOTICE "$RUNNER_TEMP/container-licences/NOTICE"
                  cmp THIRD_PARTY_NOTICES.md "$RUNNER_TEMP/container-licences/THIRD_PARTY_NOTICES.md"
                  docker cp "$container:/var/lib/telrad-relay/relay.json" "$RUNNER_TEMP/container-relay.json"
                  [[ "$(jq --raw-output .enrolmentUrl "$RUNNER_TEMP/container-relay.json")" == "$production_enrolment_url" ]]
                  TELRAD_RELAY_IMAGE='telrad-relay@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' \
                  TELRAD_RELAY_BIND_ADDRESS='127.0.0.1' \
                  TELRAD_RELAY_REPORT_HOST='report.example.invalid' \
                      docker compose -f packaging/compose.yml config --quiet

    linux-installer:
        name: Clean install and upgrade on Linux
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - name: Install, upgrade and remove the systemd service
              env:
                  TELRAD_NATIVE_INSTALL_TEST: "1"
              run: |
                  # The hosted image makes this directory world-writable for npm.
                  # Restore normal permissions only on this disposable test host.
                  sudo chown root:root /usr/local/bin
                  sudo chmod 0755 /usr/local/bin
                  scripts/check-native-installation.sh

    # The job name is kept for the existing required status check.
    windows-installer:
        name: Verify Windows installer trust checks
        runs-on: windows-2025
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: go.sum

            - name: Run relay tests on Windows
              shell: pwsh
              run: go test -race ./...

            - name: Install, upgrade and remove the Windows service
              shell: pwsh
              env:
                  TELRAD_NATIVE_INSTALL_TEST: "1"
              run: ./packaging/install.Tests.ps1
